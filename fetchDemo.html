<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Demo</title>

    <style>
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin:auto;
        }
        
        th, td {
            border: 2px solid red;
            padding: 8px;
            text-align: center;
        }
    </style>
    <script >
       

        async   function loadProduct(){
             const URL = "https://dummyjson.com/products?limit=50&skip=5";
            try {
                const response = await fetch(URL);
                const data = await response.json();
                console.log(data);
                let rows = "";
                data.products.map((i,index) => (
                    rows +=`
                         <tr>
                                 <td>${index + 1}</td>
                                 <td>${i.title}</td>
                                 <td><img src="${i.images[0]}" width="100" height="100" alt="image"></td>
                                 <td>${i.category}</td>
                                <td>${i.rating}</td>
                                <td>$${(i.price * rate).toFixed(2)}</td>
                                <td>${i.stock}</td>
                                <td> <button> add to cart</button> </td>
                    `
                ))
                const el= document.getElementById("data");
                el.innerHTML = rows;
            }
            catch (err) {
                console.log("Error: ", err);
            }
        }
            async    function getRate (){
                const URL = "https://open.er-api.com/v6/latest/USD";
                try{
                    const res = await fetch(URL);
                    const rateData = await res.json();
                    console.log(rateData.rates.INR);
                    return rateData.rates.INR;
                }
                catch(err){
                    console.log("Error: ", err);
                }
            }
        const test = async () => {
        rate = await getRate();
        }
        test();
        loadProduct();
    </script>

</head>
<body>

<h1><center>List of Products</center></h1>
<table>
    <thead>
        <tr>
            <th>Sr.No</th>
            <th>Title</th>
            <th>Image</th>
            <th>Category</th>
            <th>Rating</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="data">
    </tbody>
</table>
</body>
</html>
